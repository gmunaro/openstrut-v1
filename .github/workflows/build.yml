# Compila a OpenStrut V1 (os 28 programas de src-original e o lancador) com o QB64 PE
# e roda os testes que nao dependem do original, em Windows, Linux e macOS (x64).
# Tambem e chamado pelo release.yml (workflow_call) para gerar os executaveis que vao
# nos pacotes. Detalhes em .github/CI.md.
name: build

on:
  push:
    # tags ficam com o release.yml, que chama este workflow
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# push e pull_request do mesmo branch caem no mesmo grupo: so o mais novo roda.
# Tag e execucao manual nunca sao canceladas.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # Release oficial "4.7.0" do QB64 PE; a tag no GitHub e v4.7.0-GLFW.
  QB64_VERSAO: 4.7.0-GLFW
  # macOS: binarios para o macOS 13 em diante (o padrao do clang e a versao do runner).
  # Vale para o QB64 PE e para os programas; esta na chave do cache.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.plat }})
    strategy:
      fail-fast: false
      matrix:
        # So x64: o RT45 usa o x87 (src-original/comum/RT45X87.h, assembly inline e
        # long double de 80 bits). O macOS x64 roda nos Macs Apple Silicon pelo Rosetta 2.
        include:
          - { os: windows-latest, plat: windows-x64 }
          - { os: ubuntu-24.04, plat: linux-x64 }
          - { os: macos-15-intel, plat: macos-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Pasta do QB64
        id: plat
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # o 7z da release tem a pasta qb64pe/ na raiz: fica em C:\qb64pe\qb64pe,
            # o lugar que os scripts de tools/ usam por padrao no Windows
            echo "cache=C:\\qb64pe" >> "$GITHUB_OUTPUT"
            echo "QB64_DIR=/c/qb64pe/qb64pe" >> "$GITHUB_ENV"
          else
            echo "cache=$HOME/qb64pe" >> "$GITHUB_OUTPUT"
            echo "QB64_DIR=$HOME/qb64pe" >> "$GITHUB_ENV"
          fi

      # Dependencias de compilacao (lista do setup_lnx.sh da release). Precisam
      # estar presentes em todo build, nao so na instalacao: cada programa QB64
      # e compilado e ligado contra X11/OpenGL/ALSA. xvfb: testes sem tela.
      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential x11-utils mesa-common-dev libglu1-mesa-dev libasound2-dev \
            libpng-dev libcurl4-openssl-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev xvfb xauth

      - name: Cache do QB64 PE
        id: cache-qb64
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.plat.outputs.cache }}
          key: qb64pe-${{ env.QB64_VERSAO }}-${{ matrix.os }}-mac${{ env.MACOSX_DEPLOYMENT_TARGET }}

      - name: Instalar QB64 PE (Windows)
        if: runner.os == 'Windows' && steps.cache-qb64.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/QB64-Phoenix-Edition/QB64pe/releases/download/v$env:QB64_VERSAO/qb64pe_win-x64-$env:QB64_VERSAO.7z"
          $arq = Join-Path $env:RUNNER_TEMP "qb64pe.7z"
          Invoke-WebRequest -Uri $url -OutFile $arq
          7z x -y -oC:\qb64pe $arq | Out-Null
          if (-not (Test-Path C:\qb64pe\qb64pe\qb64pe.exe)) { throw "qb64pe.exe nao encontrado depois de extrair" }

      - name: Instalar QB64 PE (Linux)
        if: runner.os == 'Linux' && steps.cache-qb64.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/qb64pe.tar.gz" \
            "https://github.com/QB64-Phoenix-Edition/QB64pe/releases/download/v$QB64_VERSAO/qb64pe_lnx-x64-$QB64_VERSAO.tar.gz"
          tar -xzf "$RUNNER_TEMP/qb64pe.tar.gz" -C "$HOME"
          # o setup grava um atalho em ~/.local/share/applications
          mkdir -p "$HOME/.local/share/applications"
          # argumento nao vazio: compila sem abrir a IDE
          bash "$QB64_DIR/setup_lnx.sh" nao-abrir
          test -x "$QB64_DIR/qb64pe"

      - name: Instalar QB64 PE (macOS)
        if: runner.os == 'macOS' && steps.cache-qb64.outputs.cache-hit != 'true'
        run: |
          # Xcode Command Line Tools ja vem na imagem do runner
          clang++ --version
          curl -fsSL -o "$RUNNER_TEMP/qb64pe.tar.gz" \
            "https://github.com/QB64-Phoenix-Edition/QB64pe/releases/download/v$QB64_VERSAO/qb64pe_osx-$QB64_VERSAO.tar.gz"
          tar -xzf "$RUNNER_TEMP/qb64pe.tar.gz" -C "$HOME"
          # argumento nao vazio: compila sem abrir a IDE nem esperar tecla
          bash "$QB64_DIR/setup_osx.command" nao-abrir
          test -x "$QB64_DIR/qb64pe"

      # Salva logo apos instalar, para o cache guardar a instalacao limpa (sem
      # as sobras de compilacao do build).
      - name: Salvar cache do QB64 PE
        if: steps.cache-qb64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.plat.outputs.cache }}
          key: ${{ steps.cache-qb64.outputs.cache-primary-key }}

      - name: Compilar a V1 (28 programas e o lancador)
        run: bash tools/build.sh

      # o lancador abre o gerenciador, que faz CHAIN para o LAJE (sem o original)
      - name: Fumaca (Linux, sob Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash tools/fumaca.sh

      - name: Fumaca
        if: runner.os != 'Linux'
        run: bash tools/fumaca.sh

      # Sonda T20 (RT45 da V1 x bits gravados no original) nos 3 sistemas. Os tests/T_*.BAS
      # sao da versao anterior (src-reconstructed), que declara a user32 do Windows: so
      # compilam e passam no Windows.
      - name: Testes (Windows, T_* e sonda)
        if: runner.os == 'Windows'
        run: bash tools/runtests.sh

      - name: Sonda T20 (Linux, sob Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash tools/runtests.sh SONDA

      - name: Sonda T20 (macOS)
        if: runner.os == 'macOS'
        run: bash tools/runtests.sh SONDA

      # testes do comparador de paridade; os que leem o oraculo pulam sem ORACULO.
      # TypeScript, igual em todo sistema: roda so no Linux.
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Linux'
        with:
          bun-version: "1.4.2"

      - name: Paridade (bun test)
        if: runner.os == 'Linux'
        run: bun test paridade/testes

      # tar preserva a permissao de execucao (zip do artifact nao preserva)
      - name: Empacotar build
        run: tar -czf "v1-build-${{ matrix.plat }}.tar.gz" -C build .

      - name: Enviar build
        uses: actions/upload-artifact@v7
        with:
          path: v1-build-${{ matrix.plat }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 3
