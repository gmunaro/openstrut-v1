# Gera os instaladores da OpenStrut V1 (Windows, Linux e macOS, x64) e, em tag v*,
# publica numa GitHub Release deste repositorio. Detalhes em .github/CI.md.
# A V2 e web (https://gmunaro.github.io/openstrut/): os pacotes so levam um atalho.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # O mesmo build do CI (compila, fumaca e testes) nos 3 sistemas.
  build:
    uses: ./.github/workflows/build.yml

  pacote:
    name: pacote (${{ matrix.plat }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows-x64, arquivo: OpenStrut-V1-Setup-windows-x64.exe }
          - { os: ubuntu-24.04, plat: linux-x64, arquivo: OpenStrut-V1-linux-x64.tar.gz }
          - { os: macos-15-intel, plat: macos-x64, arquivo: OpenStrut-V1-macos-x64.dmg }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Entradas e saida dos scripts de pacote/ (ver pacote/comum.sh). $PWD no
      # formato do bash, para funcionar tambem no Git Bash do Windows.
      - name: Versao e pastas
        run: |
          {
            echo "V1_DIR=$PWD/v1-build"
            echo "SAIDA=$PWD/pacote-saida"
          } >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSAO=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: v1-build-${{ matrix.plat }}.tar.gz
          path: v1-artifact

      # caminho relativo: o tar do Git Bash le "D:\..." como host remoto
      - name: Extrair build da V1
        run: |
          mkdir -p v1-build
          tar -xzf "v1-artifact/v1-build-${{ matrix.plat }}.tar.gz" -C v1-build
          ls -la v1-build

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A imagem windows-latest ja traz o Inno Setup 6; o choco so roda se sumir.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nao encontrado em $iscc" }
          # barras normais: o empacotar.sh roda no Git Bash
          "ISCC=$($iscc -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pacote
        run: bash "pacote/$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')/empacotar.sh"

      # Instala o pacote como o usuario e roda a fumaca (tools/fumaca.sh) na pasta instalada.
      - name: Instalar e testar (Windows)
        if: runner.os == 'Windows'
        run: |
          t="$RUNNER_TEMP/inst"
          mkdir -p "$t"
          "$SAIDA/${{ matrix.arquivo }}" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART \
            "//DIR=$(cygpath -w "$t/OpenStrut")" "//LOG=$(cygpath -w "$t/setup.log")"
          test -f "$t/OpenStrut/OPENSTRUT.exe"
          test -f "$t/OpenStrut/OpenStrut V2 (web).url"
          bash tools/fumaca.sh "$t/OpenStrut"
          # atalhos do menu Iniciar: so os 4 .lnk, todos validos (cabecalho 4C 00 00 00)
          g="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/OpenStrut"
          ls -la "$g"
          for a in "OpenStrut V1" "Pasta das obras (disco C do OpenStrut)" "OpenStrut V2 (web)" "Desinstalar OpenStrut V1"; do
            [ "$(head -c 4 "$g/$a.lnk" | od -An -tx1 | tr -d ' \n')" = 4c000000 ] || { echo "atalho invalido: $a" >&2; exit 1; }
          done
          [ "$(find "$g" -mindepth 1 | wc -l)" -eq 4 ] || { echo "sobra no grupo do menu" >&2; exit 1; }
          "$t/OpenStrut/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          # o desinstalador volta antes de terminar: espera o grupo sumir
          for _ in $(seq 1 60); do [ -e "$g" ] || break; sleep 1; done
          [ ! -e "$g" ] || { echo "grupo do menu ficou depois de desinstalar" >&2; ls -la "$g"; exit 1; }
          [ ! -e "$t/OpenStrut/OPENSTRUT.exe" ] || { echo "programas ficaram depois de desinstalar" >&2; exit 1; }

      - name: Instalar e testar (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libglu1-mesa libopengl0
          mkdir -p "$RUNNER_TEMP/extraido"
          tar -xzf "$SAIDA/${{ matrix.arquivo }}" -C "$RUNNER_TEMP/extraido"
          (cd "$RUNNER_TEMP/extraido/OpenStrut" && ./instalar.sh)
          test -f "$HOME/.local/share/applications/openstrut-v1.desktop"
          xvfb-run -a bash tools/fumaca.sh "$HOME/.local/share/openstrut"
          "$HOME/.local/share/openstrut/desinstalar.sh"

      - name: Instalar e testar (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$SAIDA/${{ matrix.arquivo }}"
          app="$RUNNER_TEMP/dmg/OpenStrut V1.app"
          codesign --verify --verbose "$app"
          test -f "$RUNNER_TEMP/dmg/OpenStrut V2 (web).webloc"
          # pelo executavel do app: copia a V1 para ~/Library/Application Support e abre o lancador
          bash tools/fumaca.sh "$app"

          # Pelo LaunchServices, como o duplo clique (open -n), com o mesmo roteiro da fumaca.
          # Ainda nao provado no runner: se falhar, so avisa (checagem manual em .github/CI.md).
          o="$RUNNER_TEMP/open"
          mkdir -p "$o/saida"
          printf '%s\n' "L{ENTER}{TELA laje}" > "$o/roteiro.txt"
          open -n --env "SISTRUT_ROTEIRO=$o/roteiro.txt" --env "SISTRUT_SAIDA=$o/saida/" \
            --env "SISTRUT_LOG=$o/saida/log.txt" "$app" || true
          for _ in $(seq 1 60); do
            tail -1 "$o/saida/log.txt" 2> /dev/null | grep -q 'LAJE: fim$' && break
            sleep 1
          done
          if tail -1 "$o/saida/log.txt" 2> /dev/null | grep -q 'LAJE: fim$'; then
            echo "open -n: OK"
            cat "$o/saida/log.txt"
          else
            echo "::warning::open -n do OpenStrut V1.app nao chegou a 'LAJE: fim' em 60 s (ver .github/CI.md, checagem manual)"
            cat "$o/saida/log.txt" 2> /dev/null || echo "sem log"
            pkill -f "Application Support/OpenStrut/V1/" || true
          fi
          hdiutil detach "$RUNNER_TEMP/dmg" || hdiutil detach -force "$RUNNER_TEMP/dmg"

      - uses: actions/upload-artifact@v7
        with:
          path: pacote-saida/${{ matrix.arquivo }}
          archive: false
          if-no-files-found: error
          retention-days: 5

  publicar:
    name: publicar release
    needs: pacote
    # so publica em tag; execucao manual a partir de um branch deixa os pacotes
    # apenas como artifacts do run
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: OpenStrut-V1-*
          path: pacotes
          merge-multiple: true

      - name: Criar ou atualizar a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la pacotes
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" pacotes/* --clobber
          else
            pre=()
            # v1.2.0-rc1 e afins saem como pre-release
            case "$TAG" in *-*) pre=(--prerelease) ;; esac
            gh release create "$TAG" pacotes/* --verify-tag --generate-notes --title "OpenStrut V1 $TAG" "${pre[@]}"
          fi
