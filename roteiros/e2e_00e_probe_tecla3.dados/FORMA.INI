Atencao !!!
Altere somente os valores que se encontram a esquerda do sinal = .
Caso esteja com o sistema implantado em winchester, e conveniente alaterar o
drive configurado para C e para o seu diretorio de trabalho (C:\SISTRUT\=...).

Caso a parametrizacao utilizada na edicao das vigas seja diferente da SISTRUT,
e necessario que se indique o drive e diretorio onde se encontra este arquivo.
Altere entao inicialmente a parametrizacao na forma
SISTRUT=......    passa a ser   NovoNome=PARAMETRIZACAO UTILIZADA ...
e altere tambem o drive e diretorio onde ela se encontra
C:\SISTRUT\EXEC40\=DRIVE E DIRETORIO DEFAULT ..... PARAMETRIZACAO (.FOP)

