# DESENHO DE VIGAS CONTINUAS
PENA  TIPO DE DESENHO
1     escrita do nome da viga
1     escrita do nome dos ferros
1     escrita dos valores de amarracao
1     escrita do nome dos apoios
1     escrita e traco dos cortes
1     escrita da tabela
1     traco dos ferros
1     traco das amarracoes e cotas
1     traco da forma
FIM

# DESENHO DE PILARES
PENA  TIPO DE DESENHO
1     escrita do nome da coluna
1     escrita do nome dos ferros
1     escrita dos valores de amarracao
1     escrita do nome dos niveis e cotas
1     escrita e traco dos cortes
1     escrita da tabela
1     traco dos ferros
1     traco das amarracoes e cotas
1     traco da prumada
FIM

# DESENHO DE LAJES
PENA  TIPO DE DESENHO
FIM

# DESENHO DE FORMAS
PENA  TIPO DE DESENHO
1     traco das vigas
1     traco das lajes - furos internos e bordos livres
1     tracos dos pilares
1     tracos de medidas e amarracao
1     tracos do desenho de corte e elevacao
1     escrita do nome da viga
1     escrita do nome da laje
