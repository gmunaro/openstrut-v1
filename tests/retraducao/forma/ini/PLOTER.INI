*   PARAMETRIZACAO DE COMANDOS BASICOS DE PLOTAGEM
*
*   Os Comandos que veremos a seguir, sao destinados a configuracao do
*   ploter e dos dados basicos de comunicaco .
*   Este arquivo possui a configuracao de varios ploters, sendo a ordem
*   logica dos dados enunciada a seguir .
*
*   REGRAS PARA CONFIGURACAO
*   As linhas abaixo, descreverao a ordem e o significado
*   de cada um dos comandos necessarios para plotagem .
*   NUNCA ALTERE A ORDEM DE ENTRADA DOS COMANDOS .
*   MANTENHA O SINAL * AFRENTE DAS LINHAS DE COMENTARIOS .
*
*   TODOS OS COMENTARIOS ABAIXO SAO DESTINADOS A LINHA DE PLOTERS
*   HOUSTON / DIGICON / SMAR (linguagem DM/PL tm)
*
*   1) Nome do ploter para escolha pelo programa de plotagem
*      $HOUSTON DMP42-52
*        entre no formato $nome/comentarios
*
*   2) Instalacao de Comunicacao serial
*      1:2400,e,7,2
*        1          indica porta de comunicacao 1 - COM1
*        2400       indica taxa de transmisao de dados (BAUDS=bits/seg)
*        e          indica tipo de paridade n(nenhuma) o(impar) e(par)
*        7          indica numero de bits de dados (7 ou 8)
*        2          indica o numero de bits de parada/stop (1 ou 2)
*
*      LPT1:        Use somente quando o seu ploter estiver trabalhando
*                   como saida paralela .
*
*   3) Modo de selecao
*      ;:
*        indica o modo de selecao do ploter em XON/XOFF
*
*   4) Numero de Penas disponiveis no Ploter
*      1
*        indica que o ploter so possui uma pena
*        caso queira utilizar penas diferentes durante a plotagem, indique
*        abaixo o numero da pena para cada tipo de desenho.
*        caso o ploter so tenha uma pena, sera solicitada a troca manual.
*           Atencao !!!
*           A troca de pena manual somente sera executada quando a plotagem
*           for feita direta pelo SISTRUT.
*           Quando se tratar de arquivo de plotagem (.PLT) somente poderao
*           ser utilizadas o numero de penas que o ploter possui.
*
*   5) Comando para trocar a pena no desenho
*      P[1]
*        [1] indica a posicao onde sera colocado o numero da pena desejada.
*
*   6) Ajuste de velocidade
*      V[1]
*        [1] indica posicao onde sera colocado o valor da velocidade desejada.
*
*   7) Precisao de plotagem
*      EC1  (0.0254)
*        EC comando para indicar a precisao desejada no ploter DMP42
*        Configure sempre utilizando MILIMETROS
*         0.001"    use EC1
*         0.005"    use EC5
*         0.1 mm    use ECM
*        Indique entre () o valor da precisao em milimetros
*         (0.0254) ou (0.127) ou (0.1)
*
*   8) Comando para configurar a maxima area que sera plotada
*      W 0,0,Xmax,Ymax,0,0,Xmax,Ymax
*        Indica atraves de Xmax e Ymax o maximo tamanho da folha para plotar.
*        Atencao !!!  Cuidado na configuracao do tamanho da folha para nao
*        exceder a maxima largura admitida pelo seu ploter (Ymax <= ver valor)
*        Nao ha limite quanto ao comprimento ao longo da folha, somente quanto
*        ao deslocamento lateral da pena.
*
*   9) Comando para indicar posicao da pena em coordenadas absolutas
*      A
*
*  10) Comando para movimentar a pena para baixo
*      D
*
*  11) Comando para movimentar a pena para cima
*      U
*
*  12) Comando para plotagem de textos
*      Dividido em cinco (5) comandos diferentes:
*      S(S[1],)_
*      S(NI,)_
*      S(G0,)_
*      S(X[3],Y[4])_
*      S()[2]
*
*        S[1]    indica o tamanho (largura/altura) da letra .
*                [1] e a posicao no comando onde sera colocado o multiplicador
*                da unidade de precisao (EC1 visto acima) por 6/7 (larg/alt) .
*                   S10 representa para EC1 (unidade 0.0254mm) uma letra com:
*                   1.524  mm de largura (10*0.0254*6) e
*                   1.778  mm de altura  (10*0.0254*7)
*                Para o protocolo HP-GL, e necessario definir a largura do
*                caracter. Utilize a palavra [LARG] na posicao da largura .
*                Caso queira usar um multiplicador no tamanho da escrita por
*                caracteristicas do ploter, use S[1*m] onde  m  e um numero.
*        NI      indica formato do tipo nao italico (NI) ou italico (I)
*        G0      indica o padrao de caracteres utilizado
*                0(ascii) 1(matematicos) 2(germanicos) ..7(italicos)
*        [3],[4] indica incremento em x [3] e em y [4] para inclinacao do texto
*        S()[2]  posicao no comando onde sera colocado o texto a ser plotado.
*
*  13) Indicador de fim de texto
*      95
*        numero do caracter ASCII que representa o fim de texto.
*
*  14) Comando para desenho de circulo
*      CC [X],[Y],[RAIO],
*        [X]     posicao  X  do centro do circulo
*        [Y]     posicao  Y  do centro do circulo
*        [RAIO]  indica a posicao no comando onde sera colocada a variavel RAIO
*        Os pointer [X] e [Y] do comando podem ser omitidos.
*
* * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *
